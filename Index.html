<!DOCTYPE html>
<html>

<head>
    <title>
        Clientes da costureira
    </title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <table>
        <tr>
            <td>
                <form onsubmit="event.preventDefault();onFormSubmit();" autocomplete="off"> <!-- Bloqueia o formulário de auto completar--> 
                    <div>
                        <label>Nome completo*</label><label class="erroValidacao hide" id="fullNameValidationError">Esse campo é obrigatório.</label><!-- Adiciona campo de Nome Completo--> <!--Faz com que esse campo seja obrigatório-->
                        <input type="text" name="nomeCompleto" id="nomeCompleto">
                    </div>
                    <div>
                        <label>Telefone</label> <!-- Adiciona campo de Telefone-->
                        <input type="text" name="telefone" id="telefone">
                    </div>
                    <div>
                        <label>Email</label> <!-- Adiciona campo de Email-->
                        <input type="text" name="Email" id="email">
                    </div>
                    <div  class="botao-formulario"> <!-- Adiciona botão de enviar-->
                        <input type="submit" value="Enviar">
                    </div>
                </form>
            </td>
            <td>
                <table class="list" id="listaClientes"> <!-- Lista cada campo do cadastro-->
                    <thead>
                        <tr>
                            <th>Nome Completo</th>
                            <th>Telefone</th>
                            <th>Email</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </td>
        </tr>
    </table>
    <script src="script.js"></script>
</body>

</html>
